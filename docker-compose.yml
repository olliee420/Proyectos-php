services:
  mongodb:
    image: mongo:7
    container_name: hh-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      retries: 5

  app:
    build: .
    container_name: hh-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      DB_HOST: mongodb
      DB_PORT: 27017
      DB_DATABASE: HustleHouse
      DB_USERNAME: ""
      DB_PASSWORD: ""

volumes:
  mongo_data:
